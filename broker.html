<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Broker Portal | Dharti Motors</title><meta name="robots" content="index,follow"><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="css/style.css"></head><body data-admin="0">
<header><div class="nav"><a class="brand" href="index.html"><img class="logo" src="images/logo.png" alt=""><div class="brand-text">Dharti Motors<span>BROKER PORTAL</span></div></a><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span id="who" class="count"></span><a class="btn btn-navy" id="adm" href="admin.html" hidden>Admin</a><button class="btn btn-navy" id="out" type="button" hidden>Sign out</button><a class="btn btn-primary" href="index.html">View site</a></div></div></header>
<main><section style="padding:44px 0"><div class="wrap">
<div id="nocfg" class="no-match" hidden><h3>Not connected yet</h3><p>Add your Apps Script web app URL in <code>js/config.js</code>. See SETUP-GUIDE.md.</p></div>
<div id="deny" class="no-match" hidden><h3>Admin access only</h3><p>This account is not an admin. <a href="broker.html" style="color:var(--gold-ink);font-weight:700">Go to the broker portal</a></p></div>
<div id="auth" class="cols" hidden><form class="card" id="fin"><h3 style="margin-bottom:16px">Sign in</h3><div class="field" style="margin-bottom:14px"><label for="lE">Email</label><input id="lE" type="email" required autocomplete="email"></div><div class="field" style="margin-bottom:14px"><label for="lP">Password</label><input id="lP" type="password" required autocomplete="current-password"></div><button class="btn btn-navy" type="submit">Sign in</button><p class="msg" id="lM" role="alert"></p></form><form class="card" id="fup"><h3 style="margin-bottom:16px">List your cars with us</h3><div class="row"><div class="field"><label for="sN">Your name</label><input id="sN" required></div><div class="field"><label for="sF">Firm (optional)</label><input id="sF"></div></div><div class="row"><div class="field"><label for="sPh">Phone</label><input id="sPh" type="tel" required></div><div class="field"><label for="sR">I am a</label><select id="sR"><option value="broker">Broker or dealer</option><option value="individual">Individual seller</option></select></div></div><div class="row"><div class="field"><label for="sE">Email</label><input id="sE" type="email" required></div><div class="field"><label for="sP">Password (8+ characters)</label><input id="sP" type="password" minlength="8" required autocomplete="new-password"></div></div><button class="btn btn-primary" type="submit">Create account</button><p class="msg" id="sM" role="alert"></p></form></div>
<div id="app" hidden><div class="tabs" id="tabs"></div><div id="v"></div></div>
</div></section></main>
<div class="overlay fm" id="dov" hidden><div class="modal wide" role="dialog" aria-modal="true" aria-label="Car details"><button class="close" id="dclose" type="button" aria-label="Close">✕</button><div id="dbody"></div></div></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/shared.js"></script><script src="js/portal.js"></script>
</body></html>
